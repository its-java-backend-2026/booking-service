# IL COMPOSE DI QUESTO SOLO REPOSITORY: booking-service e il SUO database.
#
#   docker compose up -d --build   avvia database + servizio
#   docker compose up -d booking-db  avvia SOLO il database (sviluppo da IDE)
#   docker compose down -v         ferma E CANCELLA i dati
#
# ===========================================================================
# QUESTO FILE NON AVVIA L'INTERO SISTEMA, ED E' VOLUTO.
#
# Qui dentro c'e' solo cio' che questo repository sa costruire: il proprio
# Dockerfile ("build: .") e il proprio database. Non c'e' e non ci deve essere
# un "build: ../shows-service": renderebbe questo repository incostruibile da
# solo, e chi lo clona senza avere gli altri accanto si ritroverebbe un file
# che non funziona. Un repository per servizio ha senso solo se ogni
# repository si costruisce da solo.
#
# Il sistema completo — dal G8 cinque servizi, quattro database e il finto
# fornitore — lo monta il repository di orchestrazione, cinema-deploy.
#
# A cosa serve allora questo? A due cose:
#   - provare l'IMMAGINE di booking-service da sola, senza clonare il resto;
#   - sviluppare: si avvia il solo database (docker compose up -d booking-db),
#     si lancia booking-service dall'IDE con i default di application.yaml,
#     che puntano a localhost, e si ha il debugger attaccato.
# ===========================================================================

services:

  booking-db:
    image: postgres:17-alpine
    container_name: booking-db
    environment:
      POSTGRES_DB: ${BOOKING_DB_NAME:-booking_db}
      POSTGRES_USER: ${BOOKING_DB_USER:-cinema}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-cinema}
    ports:
      # 5433 e non 5432: shows-db occupa gia' la 5432 sul portatile.
      # E' la conseguenza pratica di "un database per servizio": due
      # PostgreSQL veri, non due schemi nello stesso.
      - "${BOOKING_DB_PORT:-5433}:5432"
    volumes:
      - booking_pgdata:/var/lib/postgresql/data
    healthcheck:
      # SENZA QUESTO, booking-service parte prima che PostgreSQL accetti
      # connessioni, Flyway fallisce e il container muore. depends_on da solo
      # aspetta che il container sia AVVIATO, non che il servizio dentro sia
      # PRONTO.
      test: ["CMD-SHELL", "pg_isready -U ${BOOKING_DB_USER:-cinema} -d ${BOOKING_DB_NAME:-booking_db}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  booking-service:
    # "build: ." e non "build: ../qualcosa": questo compose costruisce solo
    # cio' che sta in questo repository.
    build: .
    image: cinema/booking-service:1.0
    container_name: booking-service
    ports:
      - "${BOOKING_PORT:-8083}:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # booking-db, non localhost: dentro la rete di compose il servizio
      # raggiunge il database col NOME del container e la porta INTERNA 5432,
      # non la 5433 pubblicata sull'host.
      BOOKING_DB_URL: jdbc:postgresql://booking-db:5432/${BOOKING_DB_NAME:-booking_db}
      BOOKING_DB_USER: ${BOOKING_DB_USER:-cinema}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:-cinema}
      # =====================================================================
      # PASSO 6.6 — I SERVIZI A VALLE NON SONO IN QUESTO COMPOSE.
      #
      # Qui non esistono shows-service, pricing-service, payment-service e
      # loyalty-service: stanno negli altri quattro repository. I default
      # puntano quindi all'HOST, cosi' se li si sta facendo girare dall'IDE
      # (8081, 8082, 8085, 8084) il container li trova lo stesso. Se non
      # girano, POST /bookings risponde 503 (passo 6.9) e GET /bookings
      # continua a funzionare: e' il comportamento voluto.
      #
      # Per il sistema completo, con i nomi di rete veri
      # (http://shows-service:8081), si usa cinema-deploy.
      # =====================================================================
      CINEMA_SHOWS_URL: ${CINEMA_SHOWS_URL:-http://host.docker.internal:8081}
      CINEMA_PRICING_URL: ${CINEMA_PRICING_URL:-http://host.docker.internal:8082}
      # PASSO 8.1 e 8.2 — i due partecipanti della saga, anche loro fuori da
      # questo compose: stanno nei loro repository.
      CINEMA_PAYMENT_URL: ${CINEMA_PAYMENT_URL:-http://host.docker.internal:8085}
      CINEMA_LOYALTY_URL: ${CINEMA_LOYALTY_URL:-http://host.docker.internal:8084}
      SQL_LOG_LEVEL: ${SQL_LOG_LEVEL:-INFO}
      BOOKING_LOG_LEVEL: ${BOOKING_LOG_LEVEL:-INFO}
    extra_hosts:
      # Su Docker Desktop host.docker.internal c'e' gia'; su Linux no, e
      # senza questa riga i due indirizzi qui sopra non risolverebbero.
      - "host.docker.internal:host-gateway"
    depends_on:
      booking-db:
        condition: service_healthy
    healthcheck:
      # readiness, non liveness: "posso ricevere traffico?". Vedere il
      # commento in application.yaml sul perche' NON debba dipendere dalla
      # salute dei quattro servizi a valle.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8083/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  booking_pgdata:
